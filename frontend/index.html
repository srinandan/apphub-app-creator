    <meta name="description" content="Google Cloud App Hub - Application Creator. Automatically discover Google Cloud resources and manage App Hub Applications, Services, and Workloads." />
    <title>Google Cloud App Hub - Application Creator</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script>
      (function() {
        try {
          const stored = localStorage.getItem('apphub_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = (stored === 'light' || stored === 'dark') ? stored : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
