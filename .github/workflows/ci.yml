name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  go:
    name: Go Backend (Lint, Build & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: "./go.mod"
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v1.64.8
          args: --timeout=4m

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1

      - name: Build CLI & Server Binary
        run: go build -o apphub-app-creator ./cmd/apphub-app-creator/apphub-app-creator.go

      - name: Run unit tests with coverage
        run: go test -v -coverprofile=coverage.out internal/clilog internal/cmd internal/client ./cmd/apphub-app-creator

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  frontend:
    name: Frontend UI (Build & Typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build
