run:
  concurrency: 4
  timeout: 20m
  issues-exit-code: 1
  tests: false

output:
  sort-results: true

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
  gofmt:
    simplify: true
  gocyclo:
    min-complexity: 10
  goconst:
    min-len: 3
    min-occurrences: 3
  misspell:
    locale: US
  lll:
    line-length: 120
    tab-width: 1
  unparam:
    check-exported: false
  nakedret:
    max-func-lines: 30
  prealloc:
    simple: true
    range-loops: true
    for-loops: false
  gosec:
    includes:
      - G401
      - G402
      - G404

linters:
  enable:
    - errcheck
    - gocritic
    - gofumpt
    - revive
    - govet
    - lll
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - goconst
    - gofmt
    - goimports
    - gosec
    - misspell
    - nakedret
    - prealloc
    - unconvert
  disable-all: true
  fast: false

issues:
  exclude-dirs:
    - cicd
    - docs
    - test
    - third-party
  exclude-rules:
    - linters:
        - gosec
      text: "G[105,202,401,505]"
    - linters:
        - goimports
      text: "File is not `goimports`-ed"
    - linters:
        - govet
      text: "shadows declaration"
    - linters:
        - staticcheck
      text: "SA1019:"
